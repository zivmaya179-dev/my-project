<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>המרתון של נינה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@400;500;700&display=swap">
<style>
/* Layout: one column, phone first. Home = map of lessons; lesson = vertical scroll of "see it, name it, do it" cards. */
:root{
  --bg:#f4f8f6; --fg:#172220; --card:#ffffff; --line:#d5e0dc; --muted:#5d6f6a;
  --accent:#0e7c73; --soft:#dff0ec; --coral:#e25a3d; --coral-soft:#fde6df;
  --gold:#d9a400; --gold-soft:#fff4cc; --blue:#2a6fdb; --blue-soft:#e1ebfb;
  --ok:#1f8a4c; --ok-soft:#dff5e6; --bad:#c43c2b; --bad-soft:#fbe3df;
  --display:"Secular One","Heebo",system-ui,sans-serif;
  --body:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1716; --fg:#e7efec; --card:#172120; --line:#2b3a36; --muted:#9db1ab;
  --accent:#5fd3c4; --soft:#1c2f2b; --coral:#ff8d70; --coral-soft:#3a241f;
  --gold:#f2c94c; --gold-soft:#3a3214; --blue:#7fb0ff; --blue-soft:#1d2a3f;
  --ok:#5cd48a; --ok-soft:#173224; --bad:#ff8a7a; --bad-soft:#3b1f1b; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f1716; --fg:#e7efec; --card:#172120; --line:#2b3a36; --muted:#9db1ab;
  --accent:#5fd3c4; --soft:#1c2f2b; --coral:#ff8d70; --coral-soft:#3a241f;
  --gold:#f2c94c; --gold-soft:#3a3214; --blue:#7fb0ff; --blue-soft:#1d2a3f;
  --ok:#5cd48a; --ok-soft:#173224; --bad:#ff8a7a; --bad-soft:#3b1f1b; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.55;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:2rem}h2{font-size:1.5rem}h3{font-size:1.2rem}
p{margin:0}
.m{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums;white-space:nowrap}
.m sup{font-size:.7em}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px 10px;border-bottom:1px solid var(--line);margin-bottom:18px}
.top button[aria-pressed="false"]{opacity:.6}
.top button{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 14px;cursor:pointer}
.top .crumb{color:var(--muted);font-size:.95rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .spacer{flex:1}
.hero{display:grid;gap:10px;margin-bottom:22px}
.hero .kicker{font-size:.85rem;letter-spacing:.06em;color:var(--accent);font-weight:700}
.hero p{color:var(--muted);max-width:60ch}
.count{display:inline-flex;align-items:center;gap:8px;background:var(--gold-soft);color:var(--fg);border-radius:10px;padding:6px 12px;font-weight:500;width:max-content}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin-bottom:28px}
.sect{display:flex;align-items:baseline;gap:10px;margin:8px 0 10px}
.sect .tag{font-size:.8rem;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:6px;cursor:pointer;text-align:right;font:inherit;color:inherit;min-width:0}
.card:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card .n{font-size:.78rem;color:var(--muted)}
.card h3{font-size:1.1rem}
.card .blurb{font-size:.92rem;color:var(--muted)}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.card.main{border-color:var(--accent)}
.card.test{background:var(--soft)}
.lesson{display:grid;gap:16px}
.block{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px;min-width:0}
.block.explore{border-color:var(--accent)}
.block.lead{background:transparent;border:0;padding:0}
.block .eyebrow{font-size:.78rem;letter-spacing:.06em;font-weight:700;color:var(--accent)}
.block.explore .eyebrow{color:var(--coral)}
.block ul{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.block .tip{background:var(--gold-soft);border-radius:10px;padding:10px 12px;font-size:.95rem}
.block .warn{background:var(--coral-soft);border-radius:10px;padding:10px 12px;font-size:.95rem}
.block .rule{background:var(--soft);border-radius:10px;padding:10px 12px;font-weight:500}
svg{max-width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.fig{width:100%;max-width:420px;margin:0 auto}
.lbl{font-family:var(--body);font-size:15px;fill:var(--fg)}
.lbl.sm{font-size:12px}
.ln{stroke:var(--fg);stroke-width:2;fill:none;stroke-linecap:round}
.ln.thin{stroke-width:1.2;stroke:var(--muted)}
.ln.dash{stroke-dasharray:5 5;stroke:var(--muted);stroke-width:1.6}
.handle{fill:var(--card);stroke:var(--accent);stroke-width:3;cursor:grab}
.handle.coral{stroke:var(--coral)}
.arc{fill:none;stroke-width:3}
.c1{stroke:var(--coral)} .c2{stroke:var(--accent)} .c3{stroke:var(--blue)} .c4{stroke:var(--gold)}
.f1{fill:var(--coral);opacity:.25} .f2{fill:var(--accent);opacity:.25} .f3{fill:var(--blue);opacity:.25} .f4{fill:var(--gold);opacity:.3}
.readout{display:flex;flex-wrap:wrap;gap:8px;font-variant-numeric:tabular-nums}
.chip{background:var(--soft);border-radius:999px;padding:4px 12px;font-weight:500}
.chip.coral{background:var(--coral-soft)} .chip.blue{background:var(--blue-soft)} .chip.gold{background:var(--gold-soft)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 14px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.btn.sel{background:var(--soft);border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.q{border-right:4px solid var(--accent)}
.q .stem{font-weight:500}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:right;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.numin{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numin input{font:inherit;font-size:1.1rem;width:120px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);direction:ltr;text-align:center}
.fb{border-radius:10px;padding:10px 12px;font-size:.97rem}
.fb.ok{background:var(--ok-soft)} .fb.no{background:var(--bad-soft)} .fb.hint{background:var(--gold-soft)}
.sl{display:grid;gap:4px;font-size:.92rem}
.sl input{width:100%;accent-color:var(--accent)}
.tiles{display:grid;gap:8px}
.tile{font:inherit;text-align:right;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px 12px;cursor:pointer;display:grid;gap:2px}
.tile .r{font-size:.88rem;color:var(--muted)}
.tile.used{opacity:.35;cursor:default}
.seq{display:grid;gap:6px;background:var(--soft);border-radius:10px;padding:10px;min-height:48px}
.seq .st{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:.97rem}
.seq .st b{color:var(--accent)}
.seq .st.bad{color:var(--bad)}
.seq .empty{color:var(--muted);font-size:.9rem}
.letters{display:flex;gap:8px}
.letters .btn{font-size:1.2rem;min-width:52px;direction:ltr}
.summary{display:grid;gap:10px}
.summary .topic{display:flex;justify-content:space-between;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding-block:6px}
.summary .topic .btn{padding:4px 10px;font-size:.9rem}
.big{font-family:var(--display);font-size:2.4rem;color:var(--accent)}
.foot{color:var(--muted);font-size:.85rem;margin-top:24px}
@media (prefers-reduced-motion:no-preference){ .bar i{transition:width .4s} .opt,.tile{transition:background .15s} }

/* card mode */
.prog{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px;flex-wrap:wrap;flex:1}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}.dots i.on{background:var(--accent)}.dots i.cur{background:var(--coral)}
.cardv{min-height:40vh}
.say .saytext{font-size:1.3rem;line-height:1.8}
.btn.big{font-size:1.1rem;padding:12px 22px}
.row.nav{justify-content:space-between}
.card.start{background:var(--accent);color:var(--bg);border-color:var(--accent);margin-top:6px}.card.start .n,.card.start .blurb{color:var(--bg);opacity:.85}
.speak{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.speak .btn{display:inline-flex;gap:6px;align-items:center}
</style>

<div class="wrap">
  <div class="top" id="top">
    <button id="homeBtn" type="button">בית</button>
    <button id="voiceBtn" type="button" aria-pressed="true">🔊 קול</button>
    <span class="crumb" id="crumb"></span>
    <span class="spacer"></span>
    <button id="nextBtn" type="button" hidden>הבא</button>
  </div>
  <div id="view"></div>
  <p class="foot">נבנה לפי דף הנושאים של המורה (מבחן אמצע מחצית א', ט'7), דפי התרגול בגאומטריה ובאלגברה, ועמודים 376 ו-379 בספר.</p>
</div>

<script>
/* ---------- helpers ---------- */
const $ = (s, el=document) => el.querySelector(s);
const h = (tag, attrs={}, ...kids) => { const e=document.createElement(tag); for(const [k,v] of Object.entries(attrs)){ if(k==='class') e.className=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else if(v!==false&&v!=null) e.setAttribute(k,v);} for(const k of kids.flat()){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); } return e; };
const M = s => `<span class="m">${s}</span>`;
const deg = v => `${Math.round(v)}°`;
const rad = d => d*Math.PI/180;
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
let store={}; try{ store=JSON.parse(localStorage.getItem('nina-math')||'{}')||{}; }catch(e){ store={}; }
const save=()=>{ try{ localStorage.setItem('nina-math',JSON.stringify(store)); }catch(e){} };
store.q = store.q||{};

/* svg helpers */
const P=(x,y)=>`${x.toFixed(1)},${y.toFixed(1)}`;
function arcPath(cx,cy,r,a0,a1){ // angles in degrees, math orientation (counter-clockwise, y up) drawn on screen y down
  let d=a1-a0; while(d<0)d+=360; while(d>360)d-=360;
  const x0=cx+r*Math.cos(rad(a0)), y0=cy-r*Math.sin(rad(a0)), x1=cx+r*Math.cos(rad(a1)), y1=cy-r*Math.sin(rad(a1));
  return `M${P(x0,y0)} A${r} ${r} 0 ${d>180?1:0} 0 ${P(x1,y1)}`;
}
function wedgePath(cx,cy,r,a0,a1){ return arcPath(cx,cy,r,a0,a1)+` L${P(cx,cy)} Z`; }
function arcLabel(cx,cy,r,a0,a1,txt,cls='lbl'){ let d=a1-a0; while(d<0)d+=360; const am=a0+d/2; return `<text class="${cls}" text-anchor="middle" dominant-baseline="middle" x="${(cx+r*Math.cos(rad(am))).toFixed(1)}" y="${(cy-r*Math.sin(rad(am))).toFixed(1)}">${txt}</text>`; }
function line(x0,y0,x1,y1,cls='ln'){ return `<line class="${cls}" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}"/>`; }
function txt(x,y,s,cls='lbl',anchor='middle'){ return `<text class="${cls}" x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle">${s}</text>`; }
function svg(w,hh,inner,extra=''){ return `<svg class="fig" viewBox="0 0 ${w} ${hh}" ${extra}>${inner}</svg>`; }
function angBetween(cx,cy,ax,ay,bx,by){ const a=Math.atan2(cy-ay,ax-cx), b=Math.atan2(cy-by,bx-cx); let d=(b-a)*180/Math.PI; while(d<0)d+=360; while(d>=360)d-=360; return d; }
function angOf(cx,cy,x,y){ return Math.atan2(cy-y,x-cx)*180/Math.PI; }
function rightMark(cx,cy,ux,uy,vx,vy,s=12){ return `<path class="ln thin" d="M${P(cx+ux*s,cy+uy*s)} L${P(cx+ux*s+vx*s,cy+uy*s+vy*s)} L${P(cx+vx*s,cy+vy*s)}"/>`; }

/* figure generators for questions */
function figX(t,r,b,l,opts={}){ // two lines through center, labels in top/right/bottom/left regions
  const cx=200,cy=110,a=opts.a||32,L=150;
  const d=(ang)=>[cx+L*Math.cos(rad(ang)),cy-L*Math.sin(rad(ang))];
  const [x1,y1]=d(a),[x2,y2]=d(a+180),[x3,y3]=d(180-a),[x4,y4]=d(360-a);
  let s=line(x1,y1,x2,y2)+line(x3,y3,x4,y4);
  const lab=(txtv,ang,rr,cls)=>txtv?txt(cx+rr*Math.cos(rad(ang)),cy-rr*Math.sin(rad(ang)),txtv,'lbl'):'';
  s+=`<path class="arc c1" d="${arcPath(cx,cy,26,a,180-a)}"/>`+`<path class="arc c1" d="${arcPath(cx,cy,26,180+a,360-a)}"/>`;
  s+=`<path class="arc c3" d="${arcPath(cx,cy,26,180-a,180+a)}"/>`+`<path class="arc c3" d="${arcPath(cx,cy,26,-a,a)}"/>`;
  s+=lab(t,90,52)+lab(r,0,70)+lab(b,270,52)+lab(l,180,70);
  return svg(400,220,s);
}
function figAdj(left,right,opts={}){ // ray from O on a line, angle th from the right side
  const th=opts.th||62, cx=200,cy=150,L=170;
  let s=line(30,cy,370,cy)+line(cx,cy,cx+L*Math.cos(rad(th)),cy-L*Math.sin(rad(th)));
  s+=`<path class="arc c1" d="${arcPath(cx,cy,34,0,th)}"/><path class="arc c2" d="${arcPath(cx,cy,44,th,180)}"/>`;
  s+=arcLabel(cx,cy,68,0,th,right)+arcLabel(cx,cy,78,th,180,left);
  s+=txt(cx,cy+18,'O','lbl sm');
  return svg(400,180,s);
}
function figTri(A,B,C,labels,opts={}){ // labels: {a,b,c} angle labels at A,B,C; opts.height draws height from A
  const pts={A,B,C}; let s=`<path class="ln" d="M${P(...A)} L${P(...B)} L${P(...C)} Z"/>`;
  const put=(V,U,W,lab,cls)=>{ const a0=angOf(V[0],V[1],U[0],U[1]), a1=angOf(V[0],V[1],W[0],W[1]); let d=a1-a0; while(d<0)d+=360; const [s0,s1]=d<=180?[a0,a1]:[a1,a0]; return `<path class="arc ${cls}" d="${arcPath(V[0],V[1],22,s0,s1)}"/>`+(lab?arcLabel(V[0],V[1],44,s0,s1,lab):''); };
  if(labels.a!=null) s+=put(A,B,C,labels.a,'c1'); if(labels.b!=null) s+=put(B,C,A,labels.b,'c2'); if(labels.c!=null) s+=put(C,A,B,labels.c,'c3');
  if(opts.names){ const o=opts.names; s+=txt(A[0],A[1]-14,o[0],'lbl sm')+txt(B[0]-12,B[1]+12,o[1],'lbl sm')+txt(C[0]+12,C[1]+12,o[2],'lbl sm'); }
  if(opts.extra) s+=opts.extra;
  return svg(opts.w||400,opts.h||230,s);
}
function figTriLine(al,be,ga,de,opts={}){ // triangle on a line, exterior angles gamma (left) and delta (right)
  const B=[120,170],C=[280,170],A=[opts.ax||210,60]; let s=line(20,170,380,170)+`<path class="ln" d="M${P(...A)} L${P(...B)} L${P(...C)} Z"/>`;
  const aB=angOf(B[0],B[1],A[0],A[1]), aC=angOf(C[0],C[1],A[0],A[1]);
  s+=`<path class="arc c1" d="${arcPath(...B,24,0,aB)}"/>`+arcLabel(...B,46,0,aB,al);
  s+=`<path class="arc c2" d="${arcPath(...B,32,aB,180)}"/>`+arcLabel(...B,56,aB,180,ga);
  s+=`<path class="arc c1" d="${arcPath(...C,24,aC,180)}"/>`+arcLabel(...C,46,aC,180,be);
  s+=`<path class="arc c2" d="${arcPath(...C,32,0,aC)}"/>`+arcLabel(...C,56,0,aC,de);
  return svg(400,200,s);
}
function figRays(){ // ex 5: A-O-E line, rays OB, OC, OD
  const O=[200,160]; const ray=(a,n)=>line(O[0],O[1],O[0]+150*Math.cos(rad(a)),O[1]-150*Math.sin(rad(a)))+txt(O[0]+165*Math.cos(rad(a)),O[1]-165*Math.sin(rad(a)),n,'lbl sm');
  let s=line(20,160,380,160)+txt(20,178,'A','lbl sm')+txt(380,178,'E','lbl sm')+txt(200,178,'O','lbl sm');
  s+=ray(36,'D')+ray(72,'C')+ray(126,'B');
  s+=arcLabel(...O,40,0,36,'1','lbl sm')+arcLabel(...O,40,36,72,'2','lbl sm')+arcLabel(...O,40,72,126,'3','lbl sm')+arcLabel(...O,40,126,180,'4','lbl sm');
  return svg(400,190,s);
}
function figThree(){ const O=[200,110]; const lines=[[80,'A','B'],[62,'C','D'],[165,'F','E']]; let s=''; for(const [a,n1,n2] of lines){ s+=line(O[0]+110*Math.cos(rad(a)),O[1]-110*Math.sin(rad(a)),O[0]-110*Math.cos(rad(a)),O[1]+110*Math.sin(rad(a))); s+=txt(O[0]+125*Math.cos(rad(a)),O[1]-125*Math.sin(rad(a)),n1,'lbl sm')+txt(O[0]-125*Math.cos(rad(a)),O[1]+125*Math.sin(rad(a)),n2,'lbl sm'); } s+=txt(212,122,'O','lbl sm'); return svg(400,220,s); }
function figHeightChoice(){ const A=[130,50],B=[200,180],C=[370,180]; let s=line(30,180,380,180,'ln dash')+`<path class="ln" d="M${P(...A)} L${P(...B)} L${P(...C)} Z"/>`;
  s+=line(A[0],A[1],A[0],180,'ln c1')+txt(A[0]-14,185,'1','lbl'); s+=line(A[0],A[1],285,180,'ln c2')+txt(285,196,'2','lbl'); s+=line(A[0],A[1],240,180,'ln c3')+txt(240,196,'3','lbl');
  s+=txt(A[0],A[1]-14,'A','lbl sm')+txt(B[0]-4,196,'B','lbl sm')+txt(C[0]+10,196,'C','lbl sm'); return svg(400,210,s); }
function figRect(w,hh,label,inner){ let s=`<rect x="60" y="30" width="${w}" height="${hh}" fill="var(--soft)" stroke="var(--fg)" stroke-width="2"/>`; s+=txt(60+w/2,18,label.w,'lbl')+txt(60+w+22,30+hh/2,label.h,'lbl'); if(inner){ s+=`<rect x="${inner.x}" y="${inner.y}" width="${inner.w}" height="${inner.h}" fill="var(--card)" stroke="var(--fg)" stroke-width="2"/>`+txt(inner.x+inner.w/2,inner.y+inner.h/2,inner.l,'lbl'); } return svg(400,hh+60,s); }

/* ---------- interactive widgets ---------- */
function dragSVG(svgEl, onMove){
  let active=null;
  const pt=e=>{ const p=svgEl.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const m=svgEl.getScreenCTM(); if(!m) return null; const q=p.matrixTransform(m.inverse()); return [q.x,q.y]; };
  svgEl.addEventListener('pointerdown',e=>{ const t=e.target.closest('[data-h]'); if(!t) return; active=t.dataset.h; svgEl.setPointerCapture(e.pointerId); e.preventDefault(); });
  svgEl.addEventListener('pointermove',e=>{ if(!active) return; const p=pt(e); if(p) onMove(active,p[0],p[1]); });
  const end=()=>{active=null;}; svgEl.addEventListener('pointerup',end); svgEl.addEventListener('pointercancel',end);
}
const widgets={};

widgets.angleName=(root)=>{
  const A=[70,60],B=[200,170],C=[350,120]; let seq=[];
  const fig=h('div'); const out=h('div',{class:'readout'}); const btns=h('div',{class:'letters'});

/* ---------- proof builder ---------- */
function proofBuilder(root, p){
  let seq=[]; const tiles=h('div',{class:'tiles'}), seqEl=h('div',{class:'seq'}), fb=h('div');
  const order=shuffle(p.steps.map((s,i)=>i));
  const draw=()=>{ seqEl.innerHTML=''; if(!seq.length) seqEl.append(h('div',{class:'empty'},'הקישי על השורות למטה לפי הסדר הנכון. כל שורה: טענה, ואז הנימוק.'));
    seq.forEach((i,k)=>{ const s=p.steps[i]; seqEl.append(h('div',{class:'st'},h('b',{},`${k+1}.`),h('span',{html:`${s.c} <span style="color:var(--muted)">(${s.r})</span>`}))); });
    tiles.innerHTML=''; order.forEach(i=>{ const s=p.steps[i]; tiles.append(h('button',{type:'button',class:'tile'+(seq.includes(i)?' used':''),onclick:()=>{ if(seq.includes(i)) return; seq.push(i); fb.innerHTML=''; draw(); }},h('span',{html:s.c}),h('span',{class:'r',html:s.r}))); });
  };
  const check=()=>{ if(seq.length<p.steps.length){ fb.innerHTML=`<div class="fb hint">עוד לא סידרת את כל ${p.steps.length} השורות.</div>`; return; }
    const bad=seq.findIndex((v,k)=>v!==k);
    if(bad<0){ fb.innerHTML=`<div class="fb ok">הוכחה מלאה ונכונה. ${p.done||''}</div>`; store.q[p.id]=true; save(); }
    else { [...seqEl.children][bad].classList.add('bad'); fb.innerHTML=`<div class="fb no">שורה ${bad+1} לא במקום. ${p.hints && p.hints[bad] ? p.hints[bad] : 'שאלי: מה אני כבר יודעת בשלב הזה, ומה נובע ממנו?'}</div>`; }
  };
  root.append(h('div',{class:'rule',html:`<b>נתון:</b> ${p.given}<br><b>צריך למצוא / להוכיח:</b> ${p.prove}`}));
  if(p.fig) root.append(h('div',{html:p.fig}));
  root.append(seqEl, h('div',{class:'row'}, h('button',{class:'btn primary',type:'button',onclick:check},'בדקי'), h('button',{class:'btn',type:'button',onclick:()=>{seq=[];fb.innerHTML='';draw();}},'מהתחלה')), fb, tiles);
  draw();
}

/* ---------- question renderer ---------- */
function renderQ(root, q, opts={}){
  const silent=!!opts.silent; let tries=0; const fb=h('div');
  root.append(h('div',{class:'stem',html:q.q}));
  if(q.fig) root.append(h('div',{html:q.fig}));
  const done=(ok)=>{ if(!silent){ if(ok||tries>=2){ store.q[q.id]= ok && tries===1 ? true : (store.q[q.id]===true?true:'retry'); save(); } } if(opts.onAnswer) opts.onAnswer(ok); };
  if(q.kind==='mc'){
    const opts2=h('div',{class:'opts'}); const order = q.keep? q.opts.map((o,i)=>i) : shuffle(q.opts.map((o,i)=>i));
    order.forEach(i=>{ const b=h('button',{type:'button',class:'opt',html:q.opts[i]}); b.onclick=()=>{ tries++; const ok=i===q.a;
        if(silent){ [...opts2.children].forEach(c=>{c.classList.remove('sel');c.disabled=false;}); b.classList.add('sel'); opts.onAnswer(ok, i); return; }
        if(ok){ b.classList.add('right'); [...opts2.children].forEach(c=>c.disabled=true); fb.innerHTML=`<div class="fb ok"><b>נכון.</b> ${q.why}</div>`; }
        else { b.classList.add('wrong'); b.disabled=true; fb.innerHTML = tries<2 ? `<div class="fb hint">לא בדיוק. ${q.hint||'נסי שוב, תחשבי מה הכלל שמתאים כאן.'}</div>` : `<div class="fb no">התשובה הנכונה: ${q.opts[q.a]}. ${q.why}</div>`; if(tries>=2){ [...opts2.children].forEach(c=>{c.disabled=true; if(+c.dataset.i===q.a) c.classList.add('right');}); } }
        done(ok); };
      b.dataset.i=i; opts2.append(b); });
    root.append(opts2);
  } else {
    const inp=h('input',{type:'number',inputmode:'decimal',step:'any',id:'in-'+q.id,placeholder:'?'}); const unit=q.unit||'';
    const btn=h('button',{type:'button',class:'btn primary'},'בדקי');
    const go=()=>{ if(inp.value==='') return; tries++; const v=parseFloat(inp.value); const ok=Math.abs(v-q.a)<=(q.tol||0.01);
      if(silent){ opts.onAnswer(ok, v); btn.textContent='נשמר'; return; }
      if(ok){ fb.innerHTML=`<div class="fb ok"><b>נכון, ${M(q.a)}${unit}.</b> ${q.why}</div>`; inp.disabled=true; btn.disabled=true; }
      else { fb.innerHTML = tries<2 ? `<div class="fb hint">לא בדיוק. ${q.hint||'בדקי את החשבון שוב.'}</div>` : `<div class="fb no">התשובה: ${M(q.a)}${unit}. ${q.why}</div>`; if(tries>=2){inp.disabled=true;btn.disabled=true;} }
      done(ok); };
    btn.onclick=go; inp.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
    root.append(h('div',{class:'numin'},inp,unit?h('span',{},unit):null,btn));
  }
  root.append(fb);
}

/* ---------- voice: the page reads each card aloud (Hebrew voice of the phone) ---------- */
const SPEAK=window.speechSynthesis;
store.voice = store.voice===undefined ? true : store.voice;
function heVoice(){ const vs=SPEAK?SPEAK.getVoices():[]; return vs.find(v=>/^he/i.test(v.lang)&&/Carmit|Google/i.test(v.name))||vs.find(v=>/^he/i.test(v.lang))||null; }
function toSpeech(html){
  let t=html.replace(/<sup>\s*2\s*<\/sup>/g,' בריבוע ').replace(/<sup>\s*3\s*<\/sup>/g,' בשלישית ').replace(/<sup>([^<]*)<\/sup>/g,' בחזקת $1 ').replace(/<br\s*\/?>/g,'. ').replace(/<[^>]+>/g,' ');
  t=t.replace(/∢/g,' זווית ').replace(/°/g,' מעלות ').replace(/²/g,' בריבוע ').replace(/³/g,' בשלישית ').replace(/[·×]/g,' כפול ').replace(/÷/g,' חלקי ').replace(/=/g,' שווה ').replace(/\+/g,' פלוס ').replace(/(\d|x|\))\s*-\s*(?=\d|x|\()/g,'$1 פחות ').replace(/-(\d)/g,'מינוס $1');
  t=t.replace(/(\d)x\b/g,'$1 איקס').replace(/\bx\b/g,' איקס ').replace(/\by\b/g,' וואי ').replace(/\ba\b/g,' איי ').replace(/\bb\b/g,' בי ');
  t=t.replace(/α/g,' אלפא ').replace(/β/g,' בטא ').replace(/γ/g,' גמא ').replace(/δ/g,' דלתא ');
  const L={A:'איי',B:'בי',C:'סי',D:'די',E:'אי',O:'או',H:'אייץ'}; t=t.replace(/\b([A-H O])([A-H O])?([A-H O])?\b/g,(m,a,b,c)=>[a,b,c].filter(Boolean).map(k=>L[k]||k).join(' '));
  return t.replace(/\s+/g,' ').replace(/\.\s*\./g,'.').trim();
}
function speak(html){ if(!SPEAK||!store.voice) return; try{ SPEAK.cancel(); const u=new SpeechSynthesisUtterance(toSpeech(html)); u.lang='he-IL'; u.rate=0.92; const v=heVoice(); if(v) u.voice=v; SPEAK.speak(u); }catch(e){} }
function stopSpeak(){ try{ SPEAK&&SPEAK.cancel(); }catch(e){} }
if(SPEAK) SPEAK.onvoiceschanged=()=>{};

/* ---------- card question (gentle: unlimited tries, soft hints) ---------- */
const PRAISE=['יפה!','בדיוק.','נכון!','מעולה.','כל הכבוד.'];
function renderCardQ(root,q,onDone){
  let tries=0; const fb=h('div'); root.append(h('div',{class:'stem',html:q.q}));
  if(q.fig) root.append(h('div',{html:q.fig}));
  const praise=()=>PRAISE[Math.floor(Math.random()*PRAISE.length)];
  const finish=ok=>{ store.q[q.id]= ok&&tries===1 ? true : 'retry'; save(); onDone(); };
  if(q.kind==='mc'){
    const box=h('div',{class:'opts'}); const order=q.keep?q.opts.map((o,i)=>i):shuffle(q.opts.map((o,i)=>i));
    order.forEach(i=>{ const b=h('button',{type:'button',class:'opt',html:q.opts[i]}); b.onclick=()=>{ tries++;
      if(i===q.a){ b.classList.add('right'); [...box.children].forEach(c=>c.disabled=true); const pr=praise(); fb.innerHTML=`<div class="fb ok"><b>${pr}</b> ${q.why}</div>`; speak(pr+'. '+q.why); finish(true); }
      else { b.classList.add('wrong'); b.disabled=true; if(tries<2){ fb.innerHTML=`<div class="fb hint">לא זה. ${q.hint||''} נסי שוב.</div>`; speak('לא זה. '+(q.hint||'')+' נסי שוב.'); } else { [...box.children].forEach(c=>{c.disabled=true; if(+c.dataset.i===q.a) c.classList.add('right');}); fb.innerHTML=`<div class="fb hint">זה בסדר. התשובה: ${q.opts[q.a]}.<br>${q.why}</div>`; speak('זה בסדר. התשובה: '+q.opts[q.a]+'. '+q.why); finish(false); } } };
      b.dataset.i=i; box.append(b); });
    root.append(box);
  } else {
    const inp=h('input',{type:'number',inputmode:'decimal',step:'any',id:'in-'+q.id,placeholder:'?'}); const btn=h('button',{type:'button',class:'btn primary'},'בדקי');
    const go=()=>{ if(inp.value==='') return; tries++; const ok=Math.abs(parseFloat(inp.value)-q.a)<=0.01;
      if(ok){ const pr=praise(); fb.innerHTML=`<div class="fb ok"><b>${pr}</b> ${q.why}</div>`; speak(pr+'. '+q.why); inp.disabled=true; btn.disabled=true; finish(true); }
      else if(tries<2){ fb.innerHTML=`<div class="fb hint">לא זה. ${q.hint||''} נסי שוב.</div>`; speak('לא זה. '+(q.hint||'')+' נסי שוב.'); inp.value=''; inp.focus(); }
      else { fb.innerHTML=`<div class="fb hint">זה בסדר. התשובה: ${M(q.a)}${q.unit||''}.<br>${q.why}</div>`; speak('זה בסדר. התשובה: '+q.a+(q.unit||'')+'. '+q.why); inp.disabled=true; btn.disabled=true; finish(false); } };
    btn.onclick=go; inp.addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
    root.append(h('div',{class:'numin'},inp,q.unit?h('span',{},q.unit):null,btn));
  }
  root.append(fb);
}

function renderLesson(L){
  crumb.textContent=L.title; nextBtn.hidden=true; view.innerHTML='';
  let i=Math.min(store.pos[L.id]||0,L.cards.length-1);
  const wrap=h('div',{class:'lesson'}); view.append(wrap);
  const show=()=>{ wrap.innerHTML=''; const c=L.cards[i]; const isFirst=i===0, isLast=i===L.cards.length-1;
    const dots=h('div',{class:'dots'}); L.cards.forEach((_,k)=>dots.append(h('i',{class:k<i?'on':k===i?'cur':''})));
    wrap.append(h('div',{class:'prog'},dots,h('span',{},`${i+1} / ${L.cards.length}`)));
    const card=h('div',{class:'block cardv'}); let ready=false;
    const next=h('button',{class:'btn primary big',type:'button',disabled:true},isLast?'סיימתי את הנושא':'הבא');
    const enable=()=>{ ready=true; next.disabled=false; };
    if(c.t==='say'){ card.classList.add('say'); card.append(h('div',{class:'saytext',html:c.html})); if(c.fig) card.append(h('div',{html:c.fig})); card.append(readBtn(c.html)); speak(c.html); enable(); }
    else if(c.t==='try'){ card.classList.add('explore'); card.append(h('div',{class:'eyebrow'},c.h||'נסי בעצמך')); widgets[c.w](card); const tip=card.querySelector('.tip'); const say=(c.h||'נסי בעצמך')+'. '+(tip?tip.innerHTML:''); card.append(readBtn(say)); speak(say); enable(); }
    else if(c.t==='q'){ card.classList.add('q'); card.append(h('div',{class:'eyebrow'},'שאלה')); renderCardQ(card,c.q,enable); card.append(readBtn(c.q.q)); speak(c.q.q); }
    else if(c.t==='proof'){ card.classList.add('q'); card.append(h('div',{class:'eyebrow'},'סדרי את השורות')); proofBuilder(card,c.p); const ps='סדרי את השורות לפי הסדר הנכון. נתון: '+c.p.given+'. צריך למצוא: '+c.p.prove; card.append(readBtn(ps)); speak(ps); const ob=new MutationObserver(()=>{ if(card.querySelector('.fb.ok')) enable(); }); ob.observe(card,{childList:true,subtree:true}); }
    else if(c.t==='done'){ card.classList.add('say'); card.append(h('div',{class:'eyebrow'},'מה לזכור'),h('div',{class:'saytext',html:c.html})); card.append(readBtn('מה לזכור. '+c.html)); speak('מה לזכור. '+c.html); enable(); }
    wrap.append(card);
    next.onclick=()=>{ if(isLast){ store.done[L.id]=true; store.pos[L.id]=0; save(); const idx=LESSONS.indexOf(L); const nxt=LESSONS[idx+1]; wrap.innerHTML=''; speak('סיימת את הנושא. יפה מאוד. מחר כדאי לחזור עליו שלוש דקות.'); wrap.append(h('div',{class:'block say'},h('h2',{},'סיימת את הנושא. יפה מאוד.'),h('p',{},'מחר כדאי לחזור עליו 3 דקות. ככה זה נשאר בראש.'),h('div',{class:'row'},nxt?h('button',{class:'btn primary big',type:'button',onclick:()=>go(nxt.id)},'לנושא הבא: '+nxt.title):null,h('button',{class:'btn',type:'button',onclick:()=>go('')},'לבית')))); return; } i++; store.pos[L.id]=i; save(); show(); window.scrollTo(0,0); };
    wrap.append(h('div',{class:'row nav'},h('button',{class:'btn',type:'button',disabled:isFirst,onclick:()=>{ i--; store.pos[L.id]=i; save(); show(); }},'חזרה'),next));

function renderReview(){
  location.hash='review'; crumb.textContent='חזרה קצרה'; nextBtn.hidden=true; view.innerHTML='';
  const pool=[]; for(const L of LESSONS) if(store.done[L.id]) for(const c of L.cards) if(c.t==='q') pool.push(c.q);
  const picked=shuffle(pool).slice(0,5); let i=0, ok=0; const wrap=h('div',{class:'lesson'}); view.append(wrap);
  const show=()=>{ wrap.innerHTML=''; if(i>=picked.length){ wrap.append(h('div',{class:'block say'},h('h2',{},`${ok} מתוך ${picked.length}`),h('p',{},ok===picked.length?'הכול יושב. יופי.':'מה שלא יצא, נמצא בנושא שלו. אפשר לחזור אליו.'),h('div',{class:'row'},h('button',{class:'btn primary',type:'button',onclick:()=>renderReview()},'עוד 5'),h('button',{class:'btn',type:'button',onclick:()=>go('')},'לבית')))); return; }
    wrap.append(h('div',{class:'prog'},h('span',{},`${i+1} / ${picked.length}`)));
    const card=h('div',{class:'block q'}); const next=h('button',{class:'btn primary big',type:'button',disabled:true},'הבא');
    renderCardQ(card,picked[i],()=>{ if(card.querySelector('.fb.ok')) ok++; next.disabled=false; });
    next.onclick=()=>{ i++; show(); };
    wrap.append(card,h('div',{class:'row nav'},next)); };
  show();
}

/* keep math runs (7x, 115°, x = -5) left-to-right inside Hebrew sentences */
const MATH_RUN=/[∢A-Za-z0-9αβγδ][A-Za-z0-9αβγδ°²³⁴⁵¹⁰ ·×÷+\-=().,/]*[A-Za-z0-9αβγδ°²³⁴⁵¹⁰]|[A-Za-z0-9αβγδ]/g;
function fixBidi(root){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{ const p=n.parentElement; if(!p||p.closest('.m,svg,input,script,style')) return NodeFilter.FILTER_REJECT; return /[֐-׿]/.test(n.data)&&/[A-Za-z0-9]/.test(n.data)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT; }});
  const nodes=[]; while(w.nextNode()) nodes.push(w.currentNode);
  for(const n of nodes){ const frag=document.createDocumentFragment(); let last=0; n.data.replace(MATH_RUN,(m,i)=>{ frag.append(n.data.slice(last,i)); const s=document.createElement('span'); s.className='m'; s.textContent=m; frag.append(s); last=i+m.length; return m; }); frag.append(n.data.slice(last)); n.replaceWith(frag); }
}
new MutationObserver(()=>fixBidi(view)).observe(view,{childList:true,subtree:true});
