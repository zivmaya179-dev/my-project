<script>
document.documentElement.dir='rtl';document.documentElement.lang='he';
const SKEY='nina-english-v1';
let best={};
try{best=JSON.parse(localStorage.getItem(SKEY)||'{}')||{}}catch(e){best={}}
function saveBest(k,p){if(!best[k]||p>best[k]){best[k]=p;try{localStorage.setItem(SKEY,JSON.stringify(best))}catch(e){}}}

const en=s=>`<span class="en" dir="ltr">${s}</span>`;

/* ---------- Topics: explanations ---------- */
const TOPICS=[
{id:'what',t:'מה זה Present Simple?',e:'Present Simple',html:`
<p>זה הזמן שבו מדברים על דברים <span class="mark">שקורים שוב ושוב</span>. יש לו שלושה שימושים:</p>
<div class="stack">
<div><h3>1. משהו שקורה באופן קבוע</h3><p class="ex">I go to school every day.</p></div>
<div><h3>2. הרגל</h3><p class="ex">She drinks tea in the morning.</p></div>
<div><h3>3. עובדה</h3><p class="ex">Cats like milk.</p></div>
</div>
<div class="rule">איך זוכרים? אם אפשר להוסיף למשפט "כל יום" או "תמיד" והוא עדיין נשמע הגיוני, זה כנראה Present Simple.</div>`},

{id:'time',t:'ביטויי זמן',e:'Time Expressions',html:`
<p>ביטויי זמן אומרים <span class="mark">כמה פעמים</span> משהו קורה. יש שתי קבוצות.</p>
<h3>קבוצה 1: מילה אחת</h3>
<table class="tbl">
<tr><td>always</td><td>תמיד</td></tr>
<tr><td>usually</td><td>בדרך כלל</td></tr>
<tr><td>generally</td><td>בדרך כלל, באופן כללי</td></tr>
<tr><td>often</td><td>לעיתים קרובות</td></tr>
<tr><td>sometimes</td><td>לפעמים</td></tr>
<tr><td>rarely / seldom</td><td>לעיתים רחוקות</td></tr>
<tr><td>never</td><td>אף פעם</td></tr>
</table>
<div class="rule"><b>איפה שמים אותה?</b> לפני הפועל הרגיל, אבל אחרי ${en('am / is / are')}.</div>
<p class="ex">She <span class="s">often</span> <span class="v">works</span> from home.</p>
<p class="ex">She <span class="v">is</span> <span class="s">often</span> late.</p>
<div class="warn">טעות נפוצה: <span class="en">She often is late</span> ✗. עם ${en('is')} המילה באה <b>אחרי</b>.</div>
<h3>קבוצה 2: כמה מילים</h3>
<table class="tbl">
<tr><td>every day / week / year</td><td>כל יום / שבוע / שנה</td></tr>
<tr><td>once a week</td><td>פעם בשבוע</td></tr>
<tr><td>twice a week</td><td>פעמיים בשבוע</td></tr>
<tr><td>in the morning / evening</td><td>בבוקר / בערב</td></tr>
<tr><td>on Mondays</td><td>בכל יום שני</td></tr>
<tr><td>at noon / at night</td><td>בצהריים / בלילה</td></tr>
</table>
<div class="rule"><b>איפה שמים אותם?</b> בהתחלה של המשפט או בסוף שלו. אף פעם לא באמצע.</div>
<p class="ex"><span class="s">On Mondays</span>, she works from home.</p>
<p class="ex">She works from home <span class="s">on Mondays</span>.</p>
<div class="rule">שימי לב: ${en('on Monday<b>s</b>')} עם s פירושו <b>כל</b> יום שני.</div>`},

{id:'pos',t:'משפט חיובי (+)',e:'Positive sentences',html:`
<p>יש רק כלל אחד שצריך לזכור: <span class="mark">הוא, היא, זה מקבלים s</span>.</p>
<div class="stack">
<div><h3>I, you, we, they: הפועל נשאר רגיל</h3><p class="ex">They <span class="v">eat</span> lunch.</p></div>
<div><h3>he, she, it: מוסיפים s לפועל</h3><p class="ex">She <span class="v">eat<span class="s">s</span></span> lunch at school.</p></div>
</div>
<div class="rule"><b>טריק:</b> כשיש שם של אדם או חיה אחת, תחליפי אותו בראש ב-he / she / it.<br>
${en('Tom')} = he, לכן ${en('Tom plays')}.<br>
${en('The dog')} = it, לכן ${en('The dog runs')}.<br>
${en('Tom and Dana')} = they, לכן ${en('Tom and Dana play')} (בלי s).</div>`},

{id:'spell',t:'חוקי איות',e:'Spelling Rules',html:`
<p>כשמוסיפים s ל-he / she / it, לפעמים צריך לשנות קצת את המילה. ככה:</p>
<div class="stack">
<div class="card"><h3>1. רוב הפעלים: מוסיפים s</h3><p class="ex">eat → eat<span class="s">s</span> &nbsp; play → play<span class="s">s</span> &nbsp; buy → buy<span class="s">s</span></p></div>
<div class="card"><h3>2. נגמר ב- s, sh, ch, x, o: מוסיפים es</h3>
<p class="ex">kiss → kiss<span class="s">es</span><br>wash → wash<span class="s">es</span><br>watch → watch<span class="s">es</span><br>fix → fix<span class="s">es</span><br>go → go<span class="s">es</span> &nbsp; do → do<span class="s">es</span></p></div>
<div class="card"><h3>3. עיצור + y: מורידים y ומוסיפים ies</h3>
<p class="ex">cry → cr<span class="s">ies</span><br>fly → fl<span class="s">ies</span><br>study → stud<span class="s">ies</span></p>
<div class="rule">אבל אם לפני ה-y יש תנועה (a, e, i, o, u), רק מוסיפים s:<br>${en('play → plays, buy → buys, enjoy → enjoys')}</div></div>
<div class="card"><h3>4. יוצא דופן</h3><p class="ex">have → <span class="s">has</span></p><p>${en('He has a dog')} ולא ${en('He haves')}.</p></div>
</div>
<div class="warn">אם המילה נגמרת ב-e רגילה, רק מוסיפים s: ${en('come → comes, dance → dances, like → likes')}.</div>`},

{id:'neg',t:'משפט שלילי (−)',e:'Negative sentences',html:`
<p>כדי להגיד ש<b>לא</b> עושים משהו, מוסיפים מילה לפני הפועל:</p>
<div class="stack">
<div><h3>I, you, we, they + don't</h3><p class="ex">We <span class="s">don't</span> <span class="v">eat</span> lunch.</p></div>
<div><h3>he, she, it + doesn't</h3><p class="ex">She <span class="s">doesn't</span> <span class="v">eat</span> lunch at school.</p></div>
</div>
<div class="rule"><b>הסוד:</b> ה-s "קופצת" לתוך ${en('does')}. לכן אחרי ${en("doesn't")} הפועל חוזר להיות <span class="mark">נקי, בלי s</span>.</div>
<p class="ex">She doesn't <span class="x">plays</span> ✗<br>She doesn't <span class="v">play</span> ✓</p>
<p class="ex">He doesn't <span class="x">has</span> ✗<br>He doesn't <span class="v">have</span> ✓</p>
<div class="warn">כותבים ${en("doesn't")} ולא ${en("dosen't")}. זה בא מ- ${en('does + not')}.</div>`},

{id:'yn',t:'שאלות כן ולא',e:'Yes / No Questions',html:`
<p>שאלה שעונים עליה "כן" או "לא". מתחילים ב-${en('Do')} או ${en('Does')}.</p>
<p class="ex"><span class="s">Do</span> I / you / we / they <span class="v">eat</span> lunch?</p>
<p class="ex"><span class="s">Does</span> he / she / it <span class="v">eat</span> lunch?</p>
<div class="rule">גם כאן ה-s עוברת ל-${en('Does')}, אז הפועל נקי: ${en('Does she play?')} ולא ${en('Does she plays?')}</div>
<h3>תשובות קצרות</h3>
<p class="ex">Do you like pizza?<br>Yes, I do. / No, I don't.</p>
<p class="ex">Does Tom work on Sundays?<br>Yes, he does. / No, he doesn't.</p>
<div class="rule">איך הופכים משפט לשאלה?<br>${en('They play tennis.')} → ${en('<b>Do</b> they play tennis?')}<br>${en('He plays tennis.')} → ${en('<b>Does</b> he play tennis?')}</div>`},

{id:'wh',t:'שאלות עם מילות שאלה',e:'WH Questions',html:`
<p>שאלות שהתשובה עליהן היא מידע, לא "כן" או "לא".</p>
<table class="tbl">
<tr><td>What</td><td>מה</td></tr>
<tr><td>Where</td><td>איפה</td></tr>
<tr><td>When</td><td>מתי</td></tr>
<tr><td>Who</td><td>מי</td></tr>
<tr><td>Why</td><td>למה</td></tr>
<tr><td>How</td><td>איך</td></tr>
<tr><td>How often</td><td>כמה פעמים</td></tr>
</table>
<h3>המבנה</h3>
<div class="rule">מילת שאלה + ${en('do / does')} + מי עושה + פועל נקי + ?</div>
<p class="ex"><span class="s">Where</span> do you <span class="v">live</span>? &nbsp; In Haifa.</p>
<p class="ex"><span class="s">What</span> does she <span class="v">eat</span> for breakfast?</p>
<p class="ex"><span class="s">When</span> does the movie <span class="v">start</span>? &nbsp; At 8.</p>
<h3>מקרה מיוחד: שואלים <u>מי</u> עושה (Wh-subject)</h3>
<p>כששואלים ${en('Who')} על מי שעושה את הפעולה, <b>אין do / does</b>, והפועל מקבל s:</p>
<p class="ex"><span class="s">Who</span> <span class="v">lives</span> in this house? &nbsp; Dana lives there.</p>
<p class="ex"><span class="s">Who</span> <span class="v">plays</span> the piano?</p>`},
];

{h:'איזה משפט מתאר הרגל?',q:'',o:['She drinks tea every morning.','She is a girl.','The sky is blue.'],a:0,w:'"every morning" זה משהו שקורה שוב ושוב, כלומר הרגל.'},

/* ---------- Unseen ---------- */
const PASSAGE=`Lily and Dana are best friends. They meet at a small café near the shopping mall every Friday. At first, they always order a big bowl of salad with pepper. Afterwards, Dana usually takes out her photo album and they look at old pictures together.

Lily loves fashion. She wants a career as a designer, and she often draws dresses in her notebook. Dana doesn't like fashion, but she always pays attention to Lily's ideas.

Sometimes Lily is upset about school. Then Dana makes sure Lily feels better. To be honest, there's no doubt: their friendship is really special.`;
const UNSEEN=[
{h:'Where do Lily and Dana meet?',o:['At a café near the shopping mall','At school','At Dana\'s house'],a:0,w:'בשורה השנייה: at a small café near the shopping mall.'},
{h:'How often do they meet?',o:['Every Friday','Every day','Twice a week'],a:0,w:'every Friday = כל יום שישי.'},
{h:'What do they eat at first?',o:['A bowl of salad','A slice of pizza','Chocolate'],a:0,w:'At first, they always order a big bowl of salad.'},
{h:'What does Dana take out?',o:['Her photo album','Her notebook','Her phone'],a:0,w:'Dana usually takes out her photo album.'},
{h:'What career does Lily want?',o:['A designer','A teacher','A doctor'],a:0,w:'She wants a career as a designer.'},
{h:'True or False: Dana loves fashion.',o:['False','True'],a:0,w:"Dana doesn't like fashion."},
{h:'What does Dana do when Lily is upset?',o:['She makes sure Lily feels better','She goes home','She draws dresses'],a:0,w:'Dana makes sure Lily feels better.'},
].map(x=>({...x,qen:1}));

/* ---------- Helpers ---------- */
const app=document.getElementById('app');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[.?!]+$/,'').replace(/\s+/g,' ').trim();
const isHe=s=>/[֐-׿]/.test(s);
function bestTag(k){return best[k]!=null?`<span class="best">שיא: ${best[k]}%</span>`:''}

function vocabQs(n){
  return shuffle(V).slice(0,n).map((w,i)=>{
    const toHe=i%2===0;
    const others=shuffle(V.filter(x=>x!==w)).slice(0,3);
    const o=[w,...others].map(x=>toHe?x[1]:x[0]);
    return {h:toHe?'מה הפירוש בעברית?':'איך אומרים באנגלית?',q:toHe?w[0]:w[1],o,a:0,ohe:toHe?1:0,
      w:`${w[0]} = ${w[1]}`};
  });
}

/* ---------- Views ---------- */
function home(){
  app.innerHTML=`
  <div class="stack">
    <div class="hello stack" style="gap:4px">
      <h1>היי נינה!</h1>
      <p>כל החומר למבחן באנגלית. קודם קוראים הסבר קצר, ואז מתרגלים.</p>
    </div>
    <div class="sec-label">לומדים</div>
    <div class="grid">
      ${TOPICS.map((t,i)=>`<button class="tile" data-learn="${i}"><b>${t.t}</b><small>${t.e}</small>${bestTag(t.id)}</button>`).join('')}
      <button class="tile" data-go="words"><b>אוצר מילים</b><small>Vocabulary · pg 8–9</small>${bestTag('vocab')}</button>
    </div>
    <div class="sec-label">מתרגלים</div>
    <div class="grid">
      <button class="tile wide" data-quiz="all"><b>מבחן חזרה על הכל</b><small>16 questions</small>${bestTag('all')}</button>
      <button class="tile" data-go="cards"><b>כרטיסיות מילים</b><small>Flashcards</small></button>
      <button class="tile" data-go="unseen"><b>אנסין</b><small>Unseen</small>${bestTag('unseen')}</button>
    </div>
  </div>`;
  app.querySelectorAll('[data-learn]').forEach(b=>b.onclick=()=>learn(+b.dataset.learn));
  app.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>startQuiz(b.dataset.quiz));
  app.querySelector('[data-go="words"]').onclick=words;
  app.querySelector('[data-go="cards"]').onclick=cards;
  app.querySelector('[data-go="unseen"]').onclick=unseen;
  window.scrollTo(0,0);
}

function topbar(title){return `<div class="top"><button class="back" id="back">→ חזרה</button><span class="qhint">${title||''}</span></div>`}

function learn(i){
  const t=TOPICS[i];
  app.innerHTML=`${topbar()}
  <div class="stack">
    <div><h2>${t.t}</h2><div class="qhint" dir="ltr" style="text-align:right">${t.e}</div></div>
    ${t.html}
    <button class="btn" id="go">תרגלי את הנושא</button>
    ${i<TOPICS.length-1?`<button class="btn ghost" id="next">לנושא הבא: ${TOPICS[i+1].t}</button>`:`<button class="btn ghost" id="next">לאוצר המילים</button>`}
  </div>`;
  back();
  document.getElementById('go').onclick=()=>startQuiz(t.id);
  document.getElementById('next').onclick=()=>i<TOPICS.length-1?learn(i+1):words();
  window.scrollTo(0,0);
}

function words(){
  app.innerHTML=`${topbar()}
  <div class="stack">
    <h2>אוצר מילים</h2>
    <p class="qhint">ספר עמודים 8 ו-9</p>
    <div class="card words">${V.map(w=>`<div><span class="en">${esc(w[0])}</span> · ${w[1]}</div>`).join('')}</div>
    <button class="btn" id="q">מבחן מילים</button>
    <button class="btn ghost" id="c">כרטיסיות</button>
  </div>`;
  back();
  document.getElementById('q').onclick=()=>startQuiz('vocab');
  document.getElementById('c').onclick=cards;
  window.scrollTo(0,0);
}

function cards(){
  let deck=shuffle(V),i=0,flip=false;
  function draw(){
    const w=deck[i];
    app.innerHTML=`${topbar(`${i+1} / ${deck.length}`)}
    <div class="stack">
      <h2>כרטיסיות</h2>
      <div class="card flash" id="f" tabindex="0" role="button">
        <div class="big" ${flip?'':'dir="ltr"'}>${flip?w[1]:esc(w[0])}</div>
        <div class="hint">${flip?esc(w[0]):'לחצי כדי לראות את הפירוש'}</div>
      </div>
      <div class="row"><button class="btn ghost" id="p">הקודמת</button><button class="btn" id="n">הבאה</button></div>
      <button class="btn ghost" id="s">ערבבי מחדש</button>
    </div>`;
    back();
    const f=document.getElementById('f');
    f.onclick=()=>{flip=!flip;draw()};
    f.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip=!flip;draw()}};
    document.getElementById('n').onclick=()=>{i=(i+1)%deck.length;flip=false;draw()};
    document.getElementById('p').onclick=()=>{i=(i-1+deck.length)%deck.length;flip=false;draw()};
    document.getElementById('s').onclick=()=>{deck=shuffle(V);i=0;flip=false;draw()};
  }
  draw();window.scrollTo(0,0);
}

function unseen(){
  app.innerHTML=`${topbar()}
  <div class="stack">
    <h2>אנסין</h2>
    <div class="rule"><b>איך עונים על אנסין:</b><br>1. קוראים קודם את השאלות.<br>2. מחפשים בקטע את המילים מהשאלה.<br>3. התשובה כמעט תמיד כתובה ממש ליד.<br>4. לא נבהלים ממילה לא מוכרת. ממשיכים לקרוא.</div>
    <div class="card passage">${esc(PASSAGE).replace(/\n\n/g,'<br><br>')}</div>
    <button class="btn" id="go">לשאלות</button>
  </div>`;
  back();
  document.getElementById('go').onclick=()=>startQuiz('unseen');
  window.scrollTo(0,0);
}

function back(){const b=document.getElementById('back');if(b)b.onclick=home}

/* ---------- Quiz engine ---------- */
const NAMES={all:'מבחן חזרה',vocab:'מבחן מילים',unseen:'אנסין'};
function startQuiz(key){
  let qs;
  if(key==='all'){qs=[];['time','pos','spell','neg','yn','wh'].forEach(k=>qs.push(...shuffle(B[k]).slice(0,2)));qs.push(...vocabQs(4));qs=shuffle(qs)}
  else if(key==='vocab')qs=vocabQs(12);
  else if(key==='unseen')qs=UNSEEN.slice();
  else qs=shuffle(B[key]).slice(0,10);
  const title=NAMES[key]||(TOPICS.find(t=>t.id===key)||{}).t;
  let i=0,score=0,miss=[];

  function draw(){
    const q=qs[i];
    const opts=q.k==='type'?null:shuffle(q.o.map((t,j)=>({t,ok:j===q.a})));
    const optHe=q.ohe||(opts&&isHe(opts[0].t));
    app.innerHTML=`${topbar(`${title} · ${i+1}/${qs.length}`)}
    <div class="stack">
      <div class="prog"><i style="width:${(i/qs.length)*100}%"></i></div>
      <div class="card stack">
        <div class="${q.qen?'qtext':'qhint'}">${esc(q.h)}</div>
        ${q.q?`<div class="qtext ${isHe(q.q)?'he':''}">${esc(q.q)}</div>`:''}
        ${q.k==='type'
          ?`<input class="type" id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type here"><button class="btn" id="chk">בדיקה</button>`
          :`<div class="opts">${opts.map((o,j)=>`<button class="opt ${optHe?'he':''}" data-j="${j}">${esc(o.t)}</button>`).join('')}</div>`}
        <div id="fb"></div>
      </div>
    </div>`;
    back();
    if(q.k==='type'){
      const inp=document.getElementById('inp'),chk=document.getElementById('chk');
      inp.focus();
      const go=()=>{if(!inp.value.trim())return;const ok=q.a.map(norm).includes(norm(inp.value));inp.disabled=true;chk.remove();done(ok,q.a[0],inp.value)};
      chk.onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};
    }else{
      app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
        const pick=opts[+b.dataset.j];
        app.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(opts[j].ok)x.classList.add('ok')});
        if(!pick.ok)b.classList.add('no');
        done(pick.ok,q.o[q.a],pick.t);
      });
    }
  }
  function done(ok,right,given){
    const q=qs[i];
    if(ok)score++;else miss.push({q,right,given});
    const praise=['כל הכבוד!','מעולה!','נכון!','יפה מאוד!','בדיוק!'];
    document.getElementById('fb').innerHTML=`
      <div class="fb ${ok?'ok':'no'}"><b>${ok?praise[Math.floor(Math.random()*praise.length)]:'לא נורא, ככה לומדים.'}</b>
      ${ok?'':`התשובה הנכונה: <span class="en">${esc(right)}</span><br>`}${esc(q.w)}</div>
      <button class="btn" id="nx" style="margin-top:12px">${i<qs.length-1?'לשאלה הבאה':'לתוצאה'}</button>`;
    const nx=document.getElementById('nx');nx.focus();
    nx.onclick=()=>{i++;i<qs.length?draw():end()};
  }
  function end(){
    const pct=Math.round(score/qs.length*100);
    saveBest(key,pct);
    const msg=pct>=90?'וואו, את מוכנה למבחן!':pct>=70?'יפה מאוד! עוד קצת חזרה ואת שם.':pct>=50?'התחלה טובה. כדאי לקרוא שוב את ההסבר ולנסות עוד פעם.':'בואי נקרא שוב את ההסבר ונתרגל עוד פעם. זה יבוא.';
    app.innerHTML=`${topbar(title)}
    <div class="stack">
      <div class="card stack" style="text-align:center">
        <div class="score">${score}/${qs.length}</div>
        <h3>${msg}</h3>
      </div>
      ${miss.length?`<div class="sec-label">לחזרה: השאלות שטעית בהן</div>
      <div class="stack">${miss.map(m=>`<div class="card stack" style="gap:6px">
        <div class="qhint">${esc(m.q.h)}</div>
        ${m.q.q?`<div class="qtext ${isHe(m.q.q)?'he':''}" style="font-size:1.1rem">${esc(m.q.q)}</div>`:''}
        <div>התשובה הנכונה: <span class="en" style="color:var(--teal)">${esc(m.right)}</span></div>
        <div class="qhint" style="font-weight:400">${esc(m.q.w)}</div></div>`).join('')}</div>`:''}
      <button class="btn" id="again">עוד סיבוב</button>
      <button class="btn ghost" id="h">לתפריט</button>
    </div>`;
    back();
    document.getElementById('again').onclick=()=>startQuiz(key);
    document.getElementById('h').onclick=home;
    window.scrollTo(0,0);
  }
  draw();window.scrollTo(0,0);
}

home();
</script>
